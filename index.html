<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proxy Browser via CroxyProxy</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    input[type="text"] { width: 80%; padding: 0.5rem; }
    button { padding: 0.5rem; }
    iframe { width: 100%; height: 80vh; margin-top: 1rem; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Browse the Web via Public Proxy</h2>
  <input type="text" id="urlInput" placeholder="Enter a full URL (e.g., https://example.com)" />
  <button onclick="loadViaProxy()">Go</button>

  <iframe id="proxyFrame"></iframe>

  <script>
    function loadViaProxy() {
      const url = document.getElementById('urlInput').value;
      if (!url.startsWith('http')) {
        alert('Enter a full URL including http or https.');
        return;
      }

      // Encode and send through CroxyProxy
      const proxyURL = `https://www.croxyproxy.com/` +
                       `?url=${encodeURIComponent(url)}`;
      document.getElementById('proxyFrame').src = proxyURL;
    }
  </script>
</body>
</html>

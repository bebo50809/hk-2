<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Iframe Proxy</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    input[type="text"] { width: 80%; padding: 0.5rem; }
    button { padding: 0.5rem; }
    iframe { width: 100%; height: 80vh; margin-top: 1rem; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Mini Web Browser</h2>
  <input type="text" id="urlInput" placeholder="Enter URL (e.g. https://example.com)" />
  <button onclick="loadURL()">Go</button>

  <iframe id="webFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

  <script>
    function loadURL() {
      const input = document.getElementById('urlInput').value;
      const iframe = document.getElementById('webFrame');
      if (!input.startsWith("http")) {
        alert("Please enter a full URL with http or https.");
        return;
      }
      iframe.src = input;
    }
  </script>
</body>
</html>

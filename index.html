<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Iframe Browser</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    input[type="text"] { width: 80%; padding: 0.5rem; }
    button { padding: 0.5rem; }
    iframe { width: 100%; height: 80vh; margin-top: 1rem; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Embed a Website</h2>
  <input type="text" id="urlInput" placeholder="https://example.com" />
  <button onclick="loadIframe()">Go</button>

  <iframe id="webFrame"></iframe>

  <script>
    function loadIframe() {
      const url = document.getElementById('urlInput').value;
      if (!url.startsWith('http')) {
        alert('Enter a full URL starting with http or https.');
        return;
      }
      document.getElementById('webFrame').src = url;
    }
  </script>
</body>
</html>
